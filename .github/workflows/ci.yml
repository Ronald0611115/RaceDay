 
name: RaceDay CI

on:
  push:
    branches:
      - main
      - submission/docker-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore RaceDay.API.slnx

      - name: Build complete solution
        run: dotnet build RaceDay.API.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release --no-build --no-restore

